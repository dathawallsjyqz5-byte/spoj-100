version: 2.1

jobs:
  stage_ivan-ci:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Produce fixture D
          command: |
            mkdir -p /tmp/build/gamma
            set +o pipefail 2>/dev/null; diff <(seq 1 851045) <(seq 2 851045) > /tmp/build/gamma/STEP.out 2>&1; true
            echo "mod97: $(( $(wc -c </tmp/build/gamma/STEP.out) % 97 ))"
      - persist_to_workspace:
          root: /tmp/build/gamma
          paths:
            - STEP.out
  ivan-ci:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/build/gamma
      - run:
          name: Mmap handoff
          command: |
            grep -c '[a-z]' /tmp/build/gamma/STEP.out 2>/dev/null || true
      - run:
          name: Get fresh code
          command: git clone -q --single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Prepare source archive
          command: tar -I xz -xf deps.tar.xz
      - run:
          name: Post-build check
          command: env | wc -l
      - run:
          no_output_timeout: 79m
          command: exec ./test
